<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin commandes — BULLBORN</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Logo BULLBORN">
      BULLBORN
    </a>
    <span class="label" style="margin-left:auto;">Admin commandes</span>
  </nav>
</header>

<section class="page-hero">
  <span class="label">Admin</span>
  <h1>Commandes</h1>
  <p>Fais passer une commande en préparation une fois reçue.</p>
</section>

<section class="section-tight">
  <div class="container">

    <!-- Portail — même principe que livreur.html : mot de passe
         simple côté client, pas une vraie authentification. -->
    <div class="gate-wrap" id="gateWrap">
      <div class="field">
        <label for="gatePassword">Mot de passe admin</label>
        <input type="password" id="gatePassword" autocomplete="off">
      </div>
      <button type="button" class="btn btn-block" id="gateSubmit">Entrer</button>
      <p class="track-error" id="gateError">Mot de passe incorrect.</p>
    </div>

    <div id="adminWrap" style="display:none;">
      <p class="track-error" id="adminNotReady">Firebase n'est pas configuré — voir firebase-config.js.</p>
      <div class="order-list" id="orderList">
        <p class="order-empty">Chargement des commandes...</p>
      </div>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 BULLBORN.</span>
      <span>Espace interne — admin.</span>
    </div>
  </div>
</footer>

<script>
(function(){
  // Change ce mot de passe pour l'équipe admin.
  const ADMIN_PASSWORD = 'bullbornadmin2026';

  const gateWrap = document.getElementById('gateWrap');
  const gatePassword = document.getElementById('gatePassword');
  const gateSubmit = document.getElementById('gateSubmit');
  const gateError = document.getElementById('gateError');
  const adminWrap = document.getElementById('adminWrap');
  const orderListEl = document.getElementById('orderList');
  const notReadyEl = document.getElementById('adminNotReady');

  gateSubmit.addEventListener('click', () => {
    if (gatePassword.value === ADMIN_PASSWORD) {
      gateWrap.style.display = 'none';
      adminWrap.style.display = 'block';
      loadOrders();
    } else {
      gateError.classList.add('show');
    }
  });
  gatePassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') gateSubmit.click(); });

  function isFirebaseReady() {
    return typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
  }

  const STATUS_LABELS = { recue: 'Reçue', preparation: 'En préparation', livraison: 'En livraison', livree: 'Livrée' };

  function renderOrders(ordersObj) {
    const codes = Object.keys(ordersObj || {}).sort((a, b) => (ordersObj[b].createdAt || 0) - (ordersObj[a].createdAt || 0));
    if (codes.length === 0) {
      orderListEl.innerHTML = '<p class="order-empty">Aucune commande pour le moment.</p>';
      return;
    }
    orderListEl.innerHTML = codes.map(code => {
      const o = ordersObj[code];
      const date = o.createdAt ? new Date(o.createdAt).toLocaleString('fr-FR') : '-';
      const canPrepare = o.status === 'recue';
      return `
        <div class="order-row">
          <div class="order-row-main">
            <strong>${code}</strong>
            <span>${o.prenom || ''} ${o.nom || ''} · ${o.total || 0} MAD · ${date}</span>
          </div>
          <div class="order-badge st-${o.status}">${STATUS_LABELS[o.status] || o.status}</div>
          <div class="order-actions">
            ${canPrepare ? `<button type="button" class="btn btn-outline" data-prepare="${code}">Passer en préparation</button>` : ''}
          </div>
        </div>`;
    }).join('');

    orderListEl.querySelectorAll('[data-prepare]').forEach(btn => {
      btn.addEventListener('click', () => {
        firebase.database().ref('orders/' + btn.dataset.prepare + '/status').set('preparation');
      });
    });
  }

  function loadOrders() {
    if (!isFirebaseReady()) { notReadyEl.classList.add('show'); return; }
    notReadyEl.classList.remove('show');
    firebase.database().ref('orders').on('value', (snap) => {
      renderOrders(snap.val());
    });
  }
})();
</script>
</body>
</html>
